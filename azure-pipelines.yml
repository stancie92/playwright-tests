
trigger: none
pr: none

parameters:
- name: executionMode
  displayName: 'Test execution mode'
  type: string
  default: standard
  values:
  - standard
  - docker

pool:
  vmImage: ubuntu-latest

steps:
- ${{ if eq(parameters.executionMode, 'docker') }}:
  - script: docker build -t playwright-tests:1.0 .
    displayName: 'Build Docker image'

- ${{ if eq(parameters.executionMode, 'standard') }}:
  - script: npm ci
    displayName: 'Install dependencies'

- ${{ if eq(parameters.executionMode, 'standard') }}:
  - script: npx playwright install --with-deps chromium
    displayName: 'Install Chromium'

- ${{ if eq(parameters.executionMode, 'standard') }}:
  - script: npm run build
    displayName: 'Build Next.js application'

- ${{ if eq(parameters.executionMode, 'standard') }}:
  - script: npx playwright test --project=chromium
    displayName: 'Run Playwright tests'
    env:
      CI: 'true'

- ${{ if eq(parameters.executionMode, 'docker') }}:
  - script: |
      docker run --rm -e CI=true \
        -v "$(Build.SourcesDirectory)/playwright-report:/app/playwright-report" \
        -v "$(Build.SourcesDirectory)/test-results:/app/test-results" \
        playwright-tests:1.0 \
        npx playwright test --project=chromium --workers=1
    displayName: 'Run Playwright tests in Docker'      

- task: PublishTestResults@2
  displayName: 'Publish Playwright test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results/results.xml'
    testRunTitle: 'Playwright Chromium Tests'

- task: PublishPipelineArtifact@1
  displayName: 'Publish Playwright HTML report'
  condition: succeededOrFailed()
  inputs:
    targetPath: 'playwright-report'
    artifact: 'playwright-html-report'
    publishLocation: 'pipeline'    
